app-id: io.github.wellzenon.CosmicExtNiriWindows
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-ext-niri-windows-wrapper.sh

finish-args:
  # Display & Session sockets
  - --socket=wayland
  - --socket=session-bus
  - --device=dri
  # Dynamic Niri IPC socket access (/run/user/$UID/niri.wayland-*.sock)
  - --filesystem=/run/user:rw
  # Host filesystem access for apps, icons, and niri config
  - --filesystem=host:ro
  - --filesystem=~/.local/share/applications:ro
  - --filesystem=~/.local/share/icons:ro
  - --filesystem=~/.icons:ro
  - --filesystem=~/.config/niri:ro
  - --filesystem=~/.config/cosmic:ro
  # COSMIC & Freedesktop DBus services
  - --talk-name=com.system76.CosmicTheme
  - --talk-name=com.system76.CosmicTk
  - --talk-name=com.system76.CosmicSettings
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.OpenURI

build-options:
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /tmp/cargo-home
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"

modules:
  - name: cosmic-ext-niri-windows
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/cosmic-ext-niri-windows /app/bin/cosmic-ext-niri-windows
      - install -Dm755 data/cosmic-ext-niri-windows-wrapper.sh /app/bin/cosmic-ext-niri-windows-wrapper.sh
      - install -Dm644 data/io.github.wellzenon.CosmicExtNiriWindows.desktop /app/share/applications/io.github.wellzenon.CosmicExtNiriWindows.desktop
      - install -Dm644 data/io.github.wellzenon.CosmicExtNiriWindows.metainfo.xml /app/share/metainfo/io.github.wellzenon.CosmicExtNiriWindows.metainfo.xml
      - install -Dm644 data/io.github.wellzenon.CosmicExtNiriWindows.svg /app/share/icons/hicolor/scalable/apps/io.github.wellzenon.CosmicExtNiriWindows.svg
    sources:
      - type: dir
        path: .
